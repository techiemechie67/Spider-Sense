<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#090a0f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#ff003c" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Outer Web Rings -->
  <circle cx="32" cy="32" r="24" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="15" stroke="#ff003c" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="7" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2"/>

  <!-- Radial Web Strands -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="15" y1="15" x2="49" y2="49" stroke="#ff003c" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="49" y1="15" x2="15" y2="49" stroke="#ff003c" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Sling Hook / Central Node -->
  <path d="M 12,18 Q 32,32 52,18" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32,32 L 32,48" stroke="#ff003c" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.5" fill="#ff003c" stroke="#ffffff" stroke-width="1"/>
  <circle cx="52" cy="18" r="2.5" fill="#00f0ff"/>
  <circle cx="12" cy="18" r="2.5" fill="#00f0ff"/>
  <circle cx="32" cy="48" r="2.5" fill="#ff003c"/>
</svg>
